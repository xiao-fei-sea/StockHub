        - {name: warehouseId, in: query, description: 仓库 id, schema: {type: integer, format: int64, example: 1}}
        - {name: outboundNo, in: query, description: 出库单号精确查询, schema: {type: string, example: CK20261106001}}
        - {name: keyword, in: query, description: 模糊关键字, schema: {type: string, example: CK2026}}
        - {name: startDate, in: query, description: 创建开始日期（yyyy-MM-dd，含两端）, schema: {type: string, format: date, example: '2026-11-01'}}
        - {name: endDate, in: query, description: 创建结束日期（yyyy-MM-dd，含两端）, schema: {type: string, format: date, example: '2026-11-06'}}
      responses:
        '200': {$ref: '#/components/responses/Ok_OutboundPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      operationId: createOutbound
      summary: 创建出库单
      description: "创建出库单草稿（含明细 items[]），权限标识 perms：sys:outbound:add。单号按 CK+yyyyMMdd+3 位序号自动生成；业务错误：40904 单号重复、40905 重复提交。"
      tags:
        - 出库管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundOrderCreateRequest'
            example: {orderType: 销售出库, customerId: 1, sourceOrderNo: SO20261106001, expectDate: '2026-11-07', warehouseId: 1, remark: 客户加急, items: [{lineNo: 1, productId: 1, planQty: 50.000, unit: 包, remark: 待过账按 FIFO 分配批次}]}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
