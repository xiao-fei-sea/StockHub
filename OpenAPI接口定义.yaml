    # ---- 盘点单 ----
    StocktakeOrder:
      type: object
      description: 盘点单（stocktake_order；详情返回 items 明细；创建时自动生成明细）
      properties:
        id: {type: integer, format: int64, description: 主键 id, example: 1}
