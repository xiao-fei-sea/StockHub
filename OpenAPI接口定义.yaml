          example: {code: 200, message: 操作成功, data: [{id: 1, categoryName: 日用百货, level: 1}], timestamp: '2026-11-06 16:00:00'}
    # ---- 分页响应 ----
    Ok_UserPage:
      description: 成功，data 为用户分页（PageResult<User>）
      content:
        application/json:
          schema:
            allOf:
