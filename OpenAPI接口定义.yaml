openapi: 3.0.3
info:
  title: 智仓云 SmartWMS 系统接口
  version: 1.0.0
  description: |
    智仓云——智能仓库库存管理系统（SmartWMS）全系统 REST API 定义（OpenAPI 3.0.3），可直接导入 Apifox。
    本文件覆盖《17. API接口汇总清单》全部 133 个接口，路径、方法与接口编号逐一对应、零增减、零改名。

    通用约定：
    - 基础路径 /api；数据格式 application/json；字符集 UTF-8；字段命名 camelCase（数据库下划线转驼峰）。
    - 认证：JWT Bearer（securitySchemes.BearerAuth）；除 POST /api/auth/login、POST /api/auth/refresh 免认证外，其余接口均需 Header：Authorization: Bearer <accessToken>（access token 有效期 2 小时，refresh token 7 天）。
    - 统一响应信封：{code, message, data, timestamp}；分页请求参数 pageNum（默认 1）/pageSize（默认 20，最大 100）；分页响应 data = {total, pageNum, pageSize, list}。
    - 错误码：200 成功、400 参数校验失败、401 未认证/Token 过期、403 无权限、404 资源不存在、500 系统异常；5 位业务错误码 40001~50001 以 body.code 表达（详见 components.schemas.ErrorResponse 与描述）。
    - 日期：日期时间格式 yyyy-MM-dd HH:mm:ss（以 string 表示，字段 description 中标注）；纯日期格式 yyyy-MM-dd（format: date）；数量最多 3 位小数，金额最多 2 位小数。
    - 单据状态机：0 草稿 → 1 待审核 → 2 已审核 → 3 已完成（已过账 POSTED，终态）；1 → 驳回 → 4；0/1/4 → 取消 → 5；1/4 → 撤回 → 0。仅在过账（post）阶段变更库存。
    - 权限：菜单权限 + 按钮权限 perms（如 sys:user:add）+ 数据仓库权限（warehouse_id 过滤，越权返回 40302）；各接口 description 中标注权限标识。

    待确认：业务错误时 HTTP 状态码统一取 200 还是 409（本文件按 409 演示业务冲突示例，实现时全站统一）。
    待确认：创建类接口成功响应 data 是否返回新建资源 id（本文件统一按 data=null 描述，可在 Apifox 中按实现回填）。
    待确认：servers 含 /api 而 paths 按基线清单原样保留 /api 前缀，导入 Apifox 后若出现 /api/api 重复前缀，将服务器地址改为 http://localhost:8080 即可。
  contact:
    name: 智仓云 SmartWMS 项目组
servers:
  - url: http://localhost:8080/api
    description: 本地开发环境（基础路径 /api；注意 paths 中已按基线保留 /api 前缀，如出现重复前缀见 info.description 待确认说明）
security:
  - BearerAuth: []
tags:
  - name: 认证
    description: 登录、刷新令牌、登出、当前用户信息与菜单权限、用户注册（API-AUTH-001~005；login、refresh、register 免认证）
  - name: 用户管理
    description: 用户增删改查、状态/密码/角色/数据仓库权限分配、用户仓库权限查询（API-USR-001~011）
  - name: 角色权限
    description: 角色增删改查与菜单权限分配（API-ROLE-001~006）
  - name: 菜单管理
    description: 菜单树查询与菜单增删改（API-MENU-001~004）
  - name: 部门管理
    description: 部门树查询与部门增删改（API-DEPT-001~004）
  - name: 仓库管理
    description: 仓库增删改查与下拉选项（API-WH-001~006）
  - name: 库位管理
    description: 库区、货架、货位的增删改查、下拉选项与批量生成（API-AREA-001~005、API-RACK-001~004、API-LOC-001~006）
  - name: 商品管理
    description: 商品分类与商品的增删改查、下拉选项（API-CAT-001~004、API-PROD-001~006）
  - name: 供应商管理
    description: 供应商增删改查与下拉选项（API-SUP-001~005）
  - name: 客户管理
    description: 客户增删改查与下拉选项（API-CUS-001~005）
  - name: 入库管理
    description: 入库单全生命周期（创建、编辑、提交、审核、驳回、过账、取消、撤回）（API-INB-001~011）
  - name: 出库管理
    description: 出库单全生命周期，过账按 FIFO 分配批次（API-OUT-001~011）
  - name: 库存查询
    description: 库存查询、库存变动流水分页、库存汇总（API-INV-001~003）
  - name: 库存盘点
    description: 盘点单全生命周期，过账按差异调整库存（API-STK-001~011）
  - name: 库存调拨
    description: 调拨单全生命周期，过账时源仓减、目标仓增（API-TRF-001~011）
  - name: 库存预警
    description: 预警规则维护与预警记录查询、处理、扫描（API-ALR-001~008）
  - name: 数据统计
    description: 首页看板、出入库趋势、分类分布、货位利用率、Top 商品、库存账龄（API-STS-001~006）
  - name: 操作日志
    description: 操作日志分页查询与详情（API-OPL-001~002）
paths:
  # ===== 认证（API-AUTH-001~005；005 为编码阶段新增，基线外）=====
  /api/auth/login:
    post:
      operationId: login
      summary: 登录
      description: "账号密码登录，返回 accessToken/refreshToken。免认证接口（security 为空）。业务错误：40101 账号或密码错误、40102 账号已停用。"
      tags:
        - 认证
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example: {username: admin, password: Admin@123456}
      responses:
        '200': {$ref: '#/components/responses/Ok_Login'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/auth/refresh:
    post:
      operationId: refreshAuth
      summary: 刷新令牌
      description: "使用 refreshToken 换取新的 accessToken。免认证接口（security 为空）。refresh token 有效期 7 天，失效返回 401。"
      tags:
        - 认证
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example: {refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.xxx}
      responses:
        '200': {$ref: '#/components/responses/Ok_Login'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/auth/logout:
    post:
      operationId: logout
      summary: 退出登录
      description: "退出登录，注销当前令牌。权限标识 perms：认证即可（无按钮权限）。"
      tags:
        - 认证
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/auth/info:
    get:
      operationId: getAuthInfo
      summary: 获取当前用户信息与菜单权限
      description: "获取当前登录用户信息、角色、菜单树与按钮权限标识集合。权限标识 perms：认证即可（无按钮权限）。"
      tags:
        - 认证
      responses:
        '200': {$ref: '#/components/responses/Ok_AuthInfo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/auth/register:
    post:
      operationId: register
      summary: 用户注册（编码阶段新增，基线外）
      description: "公开注册新账号：username 唯一，password 至少 8 位且含字母与数字，BCrypt 存储；默认启用并绑定默认角色 ROLE_OPERATOR。免认证接口（security 为空）。业务错误：40001 参数校验失败、40904 账号已存在。"
      tags:
        - 认证
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example: {username: zhangsan, password: 'Zhangsan@123', realName: 张三, phone: '13800138000'}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ===== 用户管理（API-USR-001~011）=====
  /api/users:
    get:
      operationId: listUsers
      summary: 用户分页查询
      description: "用户分页查询，权限标识 perms：sys:user:list。支持 keyword/status/deptId 条件过滤，服务端叠加数据权限过滤。"
      tags:
        - 用户管理
      parameters:
        - $ref: '#/components/parameters/pageNum'
        - $ref: '#/components/parameters/pageSize'
        - {name: keyword, in: query, description: 模糊关键字（用户名/姓名/手机号）, schema: {type: string, example: 张}}
        - {name: status, in: query, description: 状态过滤（0 停用 1 正常）, schema: {type: integer, format: int32, example: 1}}
        - {name: deptId, in: query, description: 部门 id 过滤, schema: {type: integer, format: int64, example: 1}}
      responses:
        '200': {$ref: '#/components/responses/Ok_UserPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      operationId: createUser
      summary: 创建用户
      description: "创建用户，权限标识 perms：sys:user:add。用户名唯一，密码 BCrypt 加密存储。业务错误：40904 编码已存在（用户名重复）。"
      tags:
        - 用户管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example: {username: zhangsan, password: 'Abc@123456', realName: 张三, phone: '13800138000', email: zhangsan@example.com, deptId: 1, status: 1}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/users/{id}:
    get:
      operationId: getUserById
      summary: 用户详情
      description: "按 id 查询用户详情，权限标识 perms：sys:user:list。"
      tags:
        - 用户管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      operationId: updateUser
      summary: 编辑用户
      description: "编辑用户基础信息，权限标识 perms：sys:user:edit。用户名不可修改。"
      tags:
        - 用户管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            example: {realName: 张三, phone: '13800138000', email: zhangsan@example.com, deptId: 1, status: 1}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      operationId: deleteUser
      summary: 删除用户
      description: "逻辑删除用户，权限标识 perms：sys:user:delete。业务错误：40901 存在关联角色/数据不允许删除。"
      tags:
        - 用户管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/users/{id}/status:
    put:
      operationId: updateUserStatus
      summary: 启用/停用用户
      description: "启用或停用用户，权限标识 perms：sys:user:status（2026-11-06 已补入 sys_menu 初始化，menu id=901）。停用后登录返回 40102。可重复调用，以最后一次为准。"
      tags:
        - 用户管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusRequest'
            example: {status: 0}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/users/{id}/password:
    put:
      operationId: resetUserPassword
      summary: 重置用户密码
      description: "重置用户密码（管理员操作），权限标识 perms：sys:user:reset。密码 BCrypt 加密存储。"
      tags:
        - 用户管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPasswordRequest'
            example: {password: 'Abc@123456'}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/users/{id}/roles:
    put:
      operationId: assignUserRoles
      summary: 分配用户角色
      description: "为用户分配角色（整体替换语义），权限标识 perms：sys:user:role（与 sys_menu「分配角色」一致）。"
      tags:
        - 用户管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleGrantRequest'
            example: {roleIds: [2, 3]}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/users/{id}/warehouses:
    put:
      operationId: assignUserWarehouses
      summary: 分配用户数据仓库权限
      description: "为用户分配可见/可操作的仓库范围（整体替换语义），权限标识 perms：sys:user:assignWarehouse（2026-11-06 已补入 sys_menu 初始化，menu id=902）。admin 与 ROLE_VIEWER 不受该范围限制。"
      tags:
        - 用户管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWarehouseGrantRequest'
            example: {warehouseIds: [1, 2]}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/users/options:
    get:
      operationId: getUserOptions
      summary: 用户下拉选项
      description: "用户下拉选项（id + 显示名），权限标识 perms：sys:user:list。"
      tags:
        - 用户管理
      parameters:
        - {name: keyword, in: query, description: 模糊关键字（用户名/姓名）, schema: {type: string, example: 张}}
      responses:
        '200': {$ref: '#/components/responses/Ok_Options'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/user-warehouses/{userId}:
    get:
      operationId: getUserWarehouses
      summary: 查询用户仓库权限
      description: "查询指定用户已授权的数据仓库列表，权限标识 perms：sys:user:list。"
      tags:
        - 用户管理
      parameters:
        - {name: userId, in: path, required: true, description: 用户 id, schema: {type: integer, format: int64, example: 1}}
      responses:
        '200': {$ref: '#/components/responses/Ok_UserWarehouses'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ===== 部门管理（API-DEPT-001~004）=====
  /api/depts/tree:
    get:
      operationId: listDeptTree
      summary: 部门树查询
      description: "查询部门树（含 children 子节点），权限标识 perms：sys:dept:list。"
      tags:
        - 部门管理
      responses:
        '200': {$ref: '#/components/responses/Ok_DeptTree'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/depts:
    post:
      operationId: createDept
      summary: 创建部门
      description: "创建部门，权限标识 perms：sys:dept:add。业务错误：40904 编码已存在。"
      tags:
        - 部门管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dept'
            example: {parentId: 0, deptName: 仓储部, sort: 1, status: 1}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/depts/{id}:
    put:
      operationId: updateDept
      summary: 编辑部门
      description: "编辑部门，权限标识 perms：sys:dept:edit。"
      tags:
        - 部门管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dept'
            example: {parentId: 0, deptName: 仓储部, sort: 1, status: 1}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      operationId: deleteDept
      summary: 删除部门
      description: "删除部门，权限标识 perms：sys:dept:delete。业务错误：40901 存在下级部门或关联用户时不可删除。"
      tags:
        - 部门管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ===== 角色权限（API-ROLE-001~006）=====
  /api/roles:
    get:
      operationId: listRoles
      summary: 角色分页查询
      description: "角色分页查询，权限标识 perms：sys:role:list。"
      tags:
        - 角色权限
      parameters:
        - $ref: '#/components/parameters/pageNum'
        - $ref: '#/components/parameters/pageSize'
        - {name: keyword, in: query, description: 模糊关键字（角色名称/标识）, schema: {type: string, example: 主管}}
        - {name: status, in: query, description: 状态过滤（0 停用 1 正常）, schema: {type: integer, format: int32, example: 1}}
      responses:
        '200': {$ref: '#/components/responses/Ok_RolePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      operationId: createRole
      summary: 创建角色
      description: "创建角色，权限标识 perms：sys:role:add。roleKey 唯一，业务错误：40904 编码已存在。"
      tags:
        - 角色权限
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
