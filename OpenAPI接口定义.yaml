              - {type: object, properties: {data: {$ref: '#/components/schemas/Warehouse'}}}
          example: {code: 200, message: 操作成功, data: {id: 1, warehouseCode: WH-001, warehouseName: 华东一仓, status: 1}, timestamp: '2026-11-06 16:00:00'}
    Ok_Product:
      description: 成功，data 为商品详情
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/Product'}}}
          example: {code: 200, message: 操作成功, data: {id: 1, productCode: P-0001, productName: 抽纸 120 抽, unit: 包, status: 1}, timestamp: '2026-11-06 16:00:00'}
    Ok_Inbound:
      description: 成功，data 为入库单详情（含明细 items）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/InboundOrder'}}}
          example: {code: 200, message: 操作成功, data: {id: 1, inboundNo: RK20261106001, status: 1, totalQty: 100.000, items: [{id: 11, lineNo: 1, productId: 1, planQty: 100.000}]}, timestamp: '2026-11-06 16:00:00'}
    Ok_Outbound:
      description: 成功，data 为出库单详情（含明细 items）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/OutboundOrder'}}}
          example: {code: 200, message: 操作成功, data: {id: 1, outboundNo: CK20261106001, status: 1, totalQty: 50.000, items: [{id: 11, lineNo: 1, productId: 1, planQty: 50.000}]}, timestamp: '2026-11-06 16:00:00'}
    Ok_Transfer:
      description: 成功，data 为调拨单详情（含明细 items）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/TransferOrder'}}}
          example: {code: 200, message: 操作成功, data: {id: 1, transferNo: DB20261106001, status: 1, totalQty: 20.000, items: [{id: 11, productId: 1, planQty: 20.000}]}, timestamp: '2026-11-06 16:00:00'}
    Ok_Stocktake:
      description: 成功，data 为盘点单详情（含明细 items 与差异）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/StocktakeOrder'}}}
          example: {code: 200, message: 操作成功, data: {id: 1, stocktakeNo: PD20261106001, status: 1, items: [{id: 11, bookQty: 100.000, actualQty: 98.000, differQty: -2.000}]}, timestamp: '2026-11-06 16:00:00'}
    Ok_AlertRule:
      description: 成功，data 为预警规则详情
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/AlertRule'}}}
          example: {code: 200, message: 操作成功, data: {id: 1, ruleName: 低于下限预警, alertType: LOW_STOCK, status: 1}, timestamp: '2026-11-06 16:00:00'}
    Ok_OperLog:
      description: 成功，data 为操作日志详情
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/OperLog'}}}
          example: {code: 200, message: 操作成功, data: {id: 1, module: 入库管理, title: 创建入库单, status: 1, costTime: 35}, timestamp: '2026-11-06 16:00:00'}
    # ---- 汇总/统计响应 ----
    Ok_InventorySummary:
      description: 成功，data 为库存汇总项数组
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/InventorySummaryItem'}}}}
          example: {code: 200, message: 操作成功, data: [{warehouseName: 华东一仓, categoryName: 日用百货, totalQty: 1200.000, skuCount: 36}], timestamp: '2026-11-06 16:00:00'}
    Ok_Dashboard:
      description: 成功，data 为首页看板汇总数据
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/DashboardData'}}}
          example: {code: 200, message: 操作成功, data: {totalSku: 128, totalQty: 25600.000, todayInbound: 6, todayOutbound: 8, pendingAudit: 3, pendingAlerts: 5}, timestamp: '2026-11-06 16:00:00'}
    Ok_Trend:
      description: 成功，data 为出入库趋势点数组
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/TrendPoint'}}}}
          example: {code: 200, message: 操作成功, data: [{date: 2026-11-05, inboundQty: 300.000, outboundQty: 250.000}], timestamp: '2026-11-06 16:00:00'}
    Ok_CategoryDist:
      description: 成功，data 为库存分类分布项数组
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/CategoryDistItem'}}}}
          example: {code: 200, message: 操作成功, data: [{categoryName: 日用百货, totalQty: 8000.000, proportion: 35.5}], timestamp: '2026-11-06 16:00:00'}
    Ok_Occupancy:
      description: 成功，data 为货位利用率项数组
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/OccupancyItem'}}}}
          example: {code: 200, message: 操作成功, data: [{warehouseId: 1, warehouseName: 华东一仓, totalLocations: 500, usedLocations: 320, occupancyRate: 64.0}], timestamp: '2026-11-06 16:00:00'}
    Ok_TopProducts:
      description: 成功，data 为出入库 Top 商品项数组
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/TopProductItem'}}}}
          example: {code: 200, message: 操作成功, data: [{rank: 1, productId: 1, productName: 抽纸 120 抽, totalQty: 5000.000}], timestamp: '2026-11-06 16:00:00'}
    Ok_StockAging:
      description: 成功，data 为库存账龄/滞销项数组（待确认：分档口径）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/StockAgingItem'}}}}
  schemas:
    # ---- 核心结构 ----
    Result:
      type: object
      description: 统一响应信封（所有接口最外层结构）
      properties:
        code: {type: integer, format: int32, description: 业务状态码。200 成功、400 参数校验、401 未认证、403 无权限、404 不存在、500 系统异常；业务错误为 5 位码（40001~50001）, example: 200}
        message: {type: string, description: 提示信息, example: 操作成功}
        data: {description: 业务数据（对象或数组），失败时为 null；OpenAPI 3.0 无联合类型故未标注 type, nullable: true, example: null}
        timestamp: {type: string, description: 响应时间，格式 yyyy-MM-dd HH:mm:ss（响应中序列化为该格式字符串）, example: '2026-11-06 16:00:00'}
    PageResult:
      type: object
      description: 分页数据结构（位于 Result.data 内；请求参数 pageNum/pageSize）
      properties:
        total: {type: integer, format: int64, description: 总记录数, example: 100}
        pageNum: {type: integer, format: int32, description: 当前页码，从 1 开始, example: 1}
        pageSize: {type: integer, format: int32, description: 每页条数，默认 20 最大 100, example: 20}
        list: {type: array, description: 当前页数据（具体元素类型见各 XxxPage 定义）, items: {type: object}}
    ErrorResponse:
      type: object
      description: 错误响应结构（信封与 Result 一致）。错误码：40001 参数校验失败、40101 账号或密码错误、40102 账号已停用、40103 令牌无效、40301 功能权限不足、40302 数据仓库权限越权、40401 资源不存在、40901 单据状态不允许、40902 库存不足、40903 库存不能为负、40904 编码已存在、40905 重复提交、40906 货位状态不可用、40907 盘点过账并发冲突、40910 无数据权限、40911 过账锁获取超时、50001 执行失败、50002 资源不存在
      properties:
        code: {type: integer, format: int32, description: 错误状态码或 5 位业务错误码, example: 40901}
        message: {type: string, description: 错误提示信息, example: 当前单据状态不允许该操作}
        data: {description: 失败时恒为 null, nullable: true, example: null}
        timestamp: {type: string, description: 响应时间，格式 yyyy-MM-dd HH:mm:ss, example: '2026-11-06 16:00:00'}
    Option:
      type: object
      description: 下拉选项通用结构（各 /options 接口 data 元素）
      properties:
        id: {type: integer, format: int64, description: 选项主键 id, example: 1}
        name: {type: string, description: 显示名（对应各实体名称字段，如 warehouseName/productName）, example: 华东一仓}
        code: {type: string, description: 业务编码（可选，如 warehouseCode/productCode）, example: WH-001}
    # ---- 树结构 ----
    MenuTree:
      type: array
      description: 菜单树根节点数组（子节点在 children 字段递归）
      items: {$ref: '#/components/schemas/Menu'}
    DeptTree:
      type: array
      description: 部门树根节点数组（子节点在 children 字段递归）
      items: {$ref: '#/components/schemas/Dept'}
    CategoryTree:
      type: array
      description: 商品分类树根节点数组（子节点在 children 字段递归）
      items: {$ref: '#/components/schemas/ProductCategory'}
    # ---- 分页封装（PageResult + 类型化 list）----
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 用户列表, items: {$ref: '#/components/schemas/User'}}
    RolePage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 角色列表, items: {$ref: '#/components/schemas/Role'}}
    LogPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 操作日志列表, items: {$ref: '#/components/schemas/OperLog'}}
    WarehousePage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 仓库列表, items: {$ref: '#/components/schemas/Warehouse'}}
    AreaPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 库区列表, items: {$ref: '#/components/schemas/StorageArea'}}
    RackPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 货架列表, items: {$ref: '#/components/schemas/Rack'}}
    LocationPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 货位列表, items: {$ref: '#/components/schemas/Location'}}
    ProductPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 商品列表, items: {$ref: '#/components/schemas/Product'}}
    SupplierPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 供应商列表, items: {$ref: '#/components/schemas/Supplier'}}
    CustomerPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 客户列表, items: {$ref: '#/components/schemas/Customer'}}
    InboundPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 入库单列表, items: {$ref: '#/components/schemas/InboundOrder'}}
    OutboundPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 出库单列表, items: {$ref: '#/components/schemas/OutboundOrder'}}
    InventoryPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 库存记录列表, items: {$ref: '#/components/schemas/Inventory'}}
    FlowPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 库存流水列表, items: {$ref: '#/components/schemas/StockFlow'}}
    TransferPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 调拨单列表, items: {$ref: '#/components/schemas/TransferOrder'}}
    StocktakePage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 盘点单列表, items: {$ref: '#/components/schemas/StocktakeOrder'}}
    AlertRulePage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 预警规则列表, items: {$ref: '#/components/schemas/AlertRule'}}
    AlertRecordPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: {type: array, description: 预警记录列表, items: {$ref: '#/components/schemas/AlertRecord'}}
    # ---- 认证 ----
    LoginRequest:
      type: object
      description: 登录请求体
      required: [username, password]
      properties:
        username: {type: string, description: 登录账号, example: admin}
        password: {type: string, description: 明文密码（登录校验，传输仅限 HTTPS/本地）, example: 'Abc@123456'}
    RegisterRequest:
      type: object
      description: 用户注册请求体（API-AUTH-005，编码阶段新增）
      required: [username, password, realName]
      properties:
        username: {type: string, description: 登录账号（2~50 字符，唯一）, minLength: 2, maxLength: 50, example: zhangsan}
        password: {type: string, description: 明文密码（至少 8 位且含字母与数字，BCrypt 存储）, minLength: 8, example: 'Zhangsan@123'}
        realName: {type: string, description: 真实姓名（不超过 50 字符）, maxLength: 50, example: 张三}
        phone: {type: string, description: 手机号（可选，填写时须为 11 位）, pattern: '^1\d{10}$', example: '13800138000'}
    RefreshRequest:
      type: object
      description: 刷新令牌请求体
      required: [refreshToken]
      properties:
        refreshToken: {type: string, description: 登录时获取的 refresh token（7 天有效）, example: eyJhbGciOiJIUzI1NiJ9.refresh.xxx}
    LoginResponse:
      type: object
      description: 登录/刷新令牌响应体
      properties:
        accessToken: {type: string, description: 访问令牌（有效期 2 小时，放入 Authorization 头）, example: eyJhbGciOiJIUzI1NiJ9.xxx}
        refreshToken: {type: string, description: 刷新令牌（有效期 7 天）, example: eyJhbGciOiJIUzI1NiJ9.yyy}
        expiresIn: {type: integer, format: int32, description: access token 有效期（秒）, example: 7200}
        tokenType: {type: string, description: 令牌类型，固定 Bearer, example: Bearer}
    AuthInfo:
      type: object
      description: 当前登录用户信息、菜单与权限集合（/api/auth/info 响应 data）
      properties:
        user: {$ref: '#/components/schemas/User'}
        menus: {type: array, description: 可访问菜单树（按角色过滤）, items: {$ref: '#/components/schemas/Menu'}}
        perms: {type: array, description: 按钮权限标识集合（如 sys:user:add）, items: {type: string, example: sys:user:add}}
        roles: {type: array, description: 角色标识集合（roleKey）, items: {type: string, example: ROLE_ADMIN}}
    # ---- 系统管理实体 ----
    User:
      type: object
      description: 用户（sys_user，字段 camelCase；响应不含 password）
      properties:
        id: {type: integer, format: int64, description: 主键 id, example: 1}
        username: {type: string, description: 登录账号（唯一）, example: zhangsan}
        realName: {type: string, description: 真实姓名, example: 张三}
        phone: {type: string, description: 手机号, example: '13800138000'}
        email: {type: string, description: 邮箱, format: email, example: zhangsan@example.com}
        deptId: {type: integer, format: int64, description: 部门 id, example: 1}
        deptName: {type: string, description: 部门名称（联查冗余，响应展示用）, example: 仓储部}
        status: {type: integer, format: int32, description: 状态（0 停用 1 正常）, example: 1}
        loginDate: {type: string, description: 最后登录时间，格式 yyyy-MM-dd HH:mm:ss, example: '2026-11-06 09:30:00'}
        createTime: {type: string, description: 创建时间，格式 yyyy-MM-dd HH:mm:ss, example: '2026-11-01 10:00:00'}
        updateTime: {type: string, description: 更新时间，格式 yyyy-MM-dd HH:mm:ss, example: '2026-11-05 15:00:00'}
        createBy: {type: integer, format: int64, description: 创建人 id, example: 1}
        updateBy: {type: integer, format: int64, description: 更新人 id, example: 1}
        deleted: {type: integer, format: int32, description: 逻辑删除标记（0 否 1 是）, example: 0}
    UserCreateRequest:
      type: object
      description: 创建用户请求体
      required: [username, password, realName]
      properties:
        username: {type: string, description: 登录账号（唯一，2~20 位）, example: zhangsan}
        password: {type: string, description: 初始密码（服务端 BCrypt 加密存储）, example: 'Abc@123456'}
        realName: {type: string, description: 真实姓名, example: 张三}
        phone: {type: string, description: 手机号, example: '13800138000'}
        email: {type: string, description: 邮箱, example: zhangsan@example.com}
        deptId: {type: integer, format: int64, description: 部门 id, example: 1}
        status: {type: integer, format: int32, description: 状态（0 停用 1 正常，默认 1）, example: 1}
    UserUpdateRequest:
      type: object
      description: 编辑用户请求体（username 不可修改）
      required: [realName]
      properties:
        realName: {type: string, description: 真实姓名, example: 张三}
        phone: {type: string, description: 手机号, example: '13800138000'}
        email: {type: string, description: 邮箱, example: zhangsan@example.com}
        deptId: {type: integer, format: int64, description: 部门 id, example: 1}
        status: {type: integer, format: int32, description: 状态（0 停用 1 正常）, example: 1}
    UserStatusRequest:
      type: object
      description: 启用/停用用户请求体
      required: [status]
      properties:
        status: {type: integer, format: int32, description: 目标状态（0 停用 1 正常）, example: 0}
    UserPasswordRequest:
      type: object
      description: 重置密码请求体
      required: [password]
      properties:
        password: {type: string, description: 新密码（BCrypt 加密存储）, example: 'Abc@123456'}
    UserRoleGrantRequest:
      type: object
      description: 分配用户角色请求体（整体替换）
      required: [roleIds]
      properties:
        roleIds: {type: array, description: 角色 id 集合, items: {type: integer, format: int64, example: 2}, example: [2, 3]}
    UserWarehouseGrantRequest:
      type: object
      description: 分配用户数据仓库权限请求体（整体替换；admin 与 ROLE_VIEWER 不受限）
      required: [warehouseIds]
      properties:
        warehouseIds: {type: array, description: 可见/可操作仓库 id 集合, items: {type: integer, format: int64, example: 1}, example: [1, 2]}
    Role:
      type: object
      description: 角色（sys_role；作为创建/编辑请求体时忽略只读字段）
      properties:
        id: {type: integer, format: int64, description: 主键 id, example: 1}
        roleName: {type: string, description: 角色名称, example: 仓库主管}
        roleKey: {type: string, description: 角色标识（唯一，如 ROLE_MANAGER）, example: ROLE_MANAGER}
        roleSort: {type: integer, format: int32, description: 显示顺序, example: 2}
        status: {type: integer, format: int32, description: 状态（0 停用 1 正常）, example: 1}
        menuIds: {type: array, description: 已分配的菜单/按钮权限 id 集合（详情返回）, items: {type: integer, format: int64, example: 100}, example: [100, 101]}
        createTime: {type: string, description: 创建时间，格式 yyyy-MM-dd HH:mm:ss, example: '2026-11-01 10:00:00'}
        updateTime: {type: string, description: 更新时间，格式 yyyy-MM-dd HH:mm:ss, example: '2026-11-05 15:00:00'}
        deleted: {type: integer, format: int32, description: 逻辑删除标记（0 否 1 是）, example: 0}
    RoleMenuGrantRequest:
      type: object
      description: 分配角色菜单权限请求体（整体替换）
      required: [menuIds]
