      type: object
      description: 盘点单明细行（stocktake_order_item；differ_qty=actual_qty-book_qty）
      properties:
        id: {type: integer, format: int64, description: 主键 id, example: 11}
        orderId: {type: integer, format: int64, description: 盘点单 id, example: 1}
        lineNo: {type: integer, format: int32, description: 行号, example: 1}
        locationId: {type: integer, format: int64, description: 盘点货位 id, example: 1}
        locationCode: {type: string, description: 货位编码（联查冗余）, example: HW-010101}
        productId: {type: integer, format: int64, description: 商品 id, example: 1}
        productCode: {type: string, description: 商品编码（联查冗余）, example: P-0001}
        batchId: {type: integer, format: int64, description: 批次 id, example: 1001}
        bookQty: {type: number, format: double, description: 账面数量（生成明细时点快照，最多 3 位小数）, example: 100}
        actualQty: {type: number, format: double, description: 实盘数量（录入，最多 3 位小数）, example: 98}
        differQty: {type: number, format: double, description: 差异数量（实盘-账面，最多 3 位小数）, example: -2}
        diffReason: {type: string, description: 差异原因, example: 破损}
        status: {type: integer, format: int32, description: 明细状态（0 待盘 1 已盘）, example: 1}
    StocktakeOrderCreateRequest:
      type: object
      description: 创建盘点单请求体（服务端按范围自动生成明细并快照账面数）
      required: [warehouseId, scope, planDate]
      properties:
        warehouseId: {type: integer, format: int64, description: 盘点仓库 id, example: 1}
        areaId: {type: integer, format: int64, description: 盘点库区 id（scope=按库区时必填）, example: 1}
        scope: {type: string, description: 盘点范围（全仓/按库区）, example: 按库区}
        planDate: {type: string, format: date, description: 计划盘点日期（yyyy-MM-dd）, example: '2026-11-10'}
        remark: {type: string, description: 备注, example: A 区月度盘点}
    StocktakeOrderUpdateRequest:
      type: object
      description: 录入/更新实盘数请求体（仅草稿状态可用）
      required: [items]
      properties:
        items:
          type: array
          description: 实盘数录入行（按明细 id 更新）
          minItems: 1
          items: {$ref: '#/components/schemas/StocktakeItemInput'}
    StocktakeItemInput:
      type: object
      description: 单行实盘数录入
      required: [id, actualQty]
      properties:
        id: {type: integer, format: int64, description: 盘点明细 id, example: 11}
        actualQty: {type: number, format: double, description: 实盘数量（最多 3 位小数，不允许为负）, example: 98}
        diffReason: {type: string, description: 差异原因（有差异时建议填写）, example: 破损}
    # ---- 预警 ----
    AlertRule:
      type: object
      description: 库存预警规则（alert_rule；作为创建/编辑请求体时忽略只读字段）
      properties:
        id: {type: integer, format: int64, description: 主键 id, example: 1}
        ruleName: {type: string, description: 规则名称, example: 纸巾类低于下限预警}
        warehouseId: {type: integer, format: int64, description: 适用仓库 id（空表示全部仓库）, example: 1}
        categoryId: {type: integer, format: int64, description: 适用商品分类 id（空表示全部分类）, example: 1}
        productId: {type: integer, format: int64, description: 适用商品 id（空表示全部商品）, example: 1}
        alertType: {type: string, description: 预警类型（LOW_STOCK 低于下限/HIGH_STOCK 高于上限/NEAR_EXPIRY 临期/EXPIRED 已过期）, example: LOW_STOCK}
        thresholdValue: {type: number, format: double, description: 通用阈值（按类型生效，最多 3 位小数）, example: 100}
        nearDays: {type: integer, format: int32, description: 临期预警提前天数（NEAR_EXPIRY 生效）, example: 30}
        minQty: {type: number, format: double, description: 库存下限（LOW_STOCK 生效，最多 3 位小数）, example: 100}
        maxQty: {type: number, format: double, description: 库存上限（HIGH_STOCK 生效，最多 3 位小数）, example: 5000}
        status: {type: integer, format: int32, description: 状态（0 停用 1 启用）, example: 1}
        remark: {type: string, description: 备注, example: 每日扫描}
        createTime: {type: string, description: 创建时间，格式 yyyy-MM-dd HH:mm:ss, example: '2026-11-01 10:00:00'}
        updateTime: {type: string, description: 更新时间，格式 yyyy-MM-dd HH:mm:ss, example: '2026-11-05 15:00:00'}
        deleted: {type: integer, format: int32, description: 逻辑删除标记（0 否 1 是）, example: 0}
    AlertRecord:
      type: object
      description: 库存预警记录（alert_record，由规则扫描生成）
      properties:
        id: {type: integer, format: int64, description: 主键 id, example: 1}
        ruleId: {type: integer, format: int64, description: 触发的规则 id, example: 1}
        alertType: {type: string, description: 预警类型（LOW_STOCK/HIGH_STOCK/NEAR_EXPIRY/EXPIRED）, example: LOW_STOCK}
        warehouseId: {type: integer, format: int64, description: 仓库 id, example: 1}
        warehouseName: {type: string, description: 仓库名称（联查冗余）, example: 华东一仓}
        productId: {type: integer, format: int64, description: 商品 id, example: 1}
        productCode: {type: string, description: 商品编码（联查冗余）, example: P-0001}
        batchId: {type: integer, format: int64, description: 批次 id（批次相关预警时返回）, example: 1001}
        currentValue: {type: number, format: double, description: 触发时的当前值（库存量/剩余天数，最多 3 位小数）, example: 60}
        thresholdValue: {type: number, format: double, description: 触发的阈值（最多 3 位小数）, example: 100}
        level: {type: string, description: 预警级别（提示/警告/严重，分级规则待确认）, example: 警告}
        status: {type: integer, format: int32, description: 处理状态（0 未处理 1 已处理）, example: 0}
        handleRemark: {type: string, description: 处理备注, example: 已补货}
        handleUser: {type: string, description: 处理人姓名, example: 张三}
        handleTime: {type: string, description: 处理时间，格式 yyyy-MM-dd HH:mm:ss, example: '2026-11-06 18:00:00'}
        createTime: {type: string, description: 预警生成时间，格式 yyyy-MM-dd HH:mm:ss, example: '2026-11-06 08:00:00'}
    AlertHandleRequest:
      type: object
      description: 处理预警请求体
      properties:
        handleRemark: {type: string, description: 处理备注（说明处理措施）, example: 已补货，库存恢复至安全线}
    AlertScanRequest:
      type: object
      description: 手动触发预警扫描请求体（body 可省略）
      properties:
        warehouseId: {type: integer, format: int64, description: 指定仓库 id（不传则扫描全部授权仓库）, example: 1}
    # ---- 通用动作请求体 ----
    AuditRequest:
      type: object
      description: 审核动作请求体（入库/出库/调拨/盘点审核复用）
      properties:
        remark: {type: string, description: 审核备注（可选）, example: 数据核对无误}
    RejectRequest:
      type: object
      description: 驳回动作请求体（入库/出库/调拨/盘点驳回复用）
      required: [reason]
      properties:
        reason: {type: string, description: 驳回原因（必填，将记录于操作日志）, example: 明细数量与采购单不一致，请核对}
    # ---- 数据统计 ----
    DashboardData:
      type: object
      description: 首页看板汇总数据（指标口径待确认）
      properties:
        totalSku: {type: integer, format: int32, description: 在库商品 SKU 数, example: 128}
        totalQty: {type: number, format: double, description: 库存总数量（最多 3 位小数）, example: 25600}
        todayInbound: {type: integer, format: int32, description: 今日入库单数, example: 6}
        todayOutbound: {type: integer, format: int32, description: 今日出库单数, example: 8}
        pendingAudit: {type: integer, format: int32, description: 待审核单据数, example: 3}
        pendingAlerts: {type: integer, format: int32, description: 未处理预警数, example: 5}
        alertCount7d: {type: integer, format: int32, description: 近 7 天预警数, example: 12}
        stockValue: {type: number, format: double, description: 库存总金额（元，最多 2 位小数，基于商品参考单价）, example: 128000.5}
    TrendPoint:
      type: object
      description: 出入库趋势单日数据点
      properties:
        date: {type: string, format: date, description: 日期（yyyy-MM-dd）, example: '2026-11-05'}
        inboundQty: {type: number, format: double, description: 当日入库数量合计（最多 3 位小数）, example: 300}
        outboundQty: {type: number, format: double, description: 当日出库数量合计（最多 3 位小数）, example: 250}
    CategoryDistItem:
      type: object
      description: 库存分类分布项
      properties:
        categoryId: {type: integer, format: int64, description: 分类 id, example: 1}
        categoryName: {type: string, description: 分类名称, example: 日用百货}
        totalQty: {type: number, format: double, description: 分类库存数量合计（最多 3 位小数）, example: 8000}
        proportion: {type: number, format: double, description: 占比（百分数，如 35.5 表示 35.5%）, example: 35.5}
    OccupancyItem:
      type: object
      description: 货位利用率统计项
      properties:
        warehouseId: {type: integer, format: int64, description: 仓库 id, example: 1}
        warehouseName: {type: string, description: 仓库名称, example: 华东一仓}
        totalLocations: {type: integer, format: int32, description: 总货位数, example: 500}
        usedLocations: {type: integer, format: int32, description: 已占用货位数（currentStatus=占用）, example: 320}
        occupancyRate: {type: number, format: double, description: 利用率（百分数，如 64.0 表示 64.0%）, example: 64}
    TopProductItem:
      type: object
      description: 出入库 Top 商品项
      properties:
        rank: {type: integer, format: int32, description: 排名（从 1 开始）, example: 1}
        productId: {type: integer, format: int64, description: 商品 id, example: 1}
        productCode: {type: string, description: 商品编码, example: P-0001}
        productName: {type: string, description: 商品名称, example: 抽纸 120 抽}
        totalQty: {type: number, format: double, description: 出入库数量合计（最多 3 位小数）, example: 5000}
    StockAgingItem:
      type: object
      description: 库存账龄/滞销分析项（分档口径待确认）
      properties:
        productId: {type: integer, format: int64, description: 商品 id, example: 1}
        productCode: {type: string, description: 商品编码, example: P-0001}
        productName: {type: string, description: 商品名称, example: 抽纸 120 抽}
        batchNo: {type: string, description: 批次号（按批次账龄时返回）, example: B2026110601}
        lastOutTime: {type: string, description: 最后出库时间，格式 yyyy-MM-dd HH:mm:ss（无出库记录时为空）, example: '2026-09-20 10:00:00'}
        agingDays: {type: integer, format: int32, description: 库龄/滞销天数, example: 45}
        qty: {type: number, format: double, description: 当前库存数量（最多 3 位小数）, example: 200}
