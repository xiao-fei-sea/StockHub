  # ===== 库存查询（API-INV-001~003）=====
  /api/inventory:
    get:
      operationId: queryInventory
      summary: 库存查询
      description: "库存分页查询（warehouse_id 为强制维度），权限标识 perms：sys:inventory:list。支持 warehouseId/categoryId/productId/locationId/batchNo/keyword/onlyPositive 过滤。"
      tags:
        - 库存查询
      parameters:
        - $ref: '#/components/parameters/pageNum'
        - $ref: '#/components/parameters/pageSize'
        - {name: warehouseId, in: query, description: 仓库 id（强制维度）, schema: {type: integer, format: int64, example: 1}}
        - {name: categoryId, in: query, description: 商品分类 id, schema: {type: integer, format: int64, example: 1}}
        - {name: productId, in: query, description: 商品 id, schema: {type: integer, format: int64, example: 1}}
        - {name: locationId, in: query, description: 货位 id, schema: {type: integer, format: int64, example: 1}}
        - {name: batchNo, in: query, description: 批次号精确查询, schema: {type: string, example: B2026110601}}
        - {name: keyword, in: query, description: 模糊关键字（商品编码/名称）, schema: {type: string, example: 纸巾}}
        - {name: onlyPositive, in: query, description: 仅显示库存大于 0 的记录（默认 false）, schema: {type: boolean, example: true}}
      responses:
        '200': {$ref: '#/components/responses/Ok_InventoryPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/inventory/flows:
    get:
      operationId: queryStockFlows
      summary: 库存流水分页查询
      description: "库存变动流水分页查询（before_qty/after_qty 可追溯），权限标识 perms：sys:inventory:list。支持 warehouseId/productId/flowType/refNo/startDate/endDate 过滤。"
      tags:
        - 库存查询
      parameters:
        - $ref: '#/components/parameters/pageNum'
        - $ref: '#/components/parameters/pageSize'
        - {name: warehouseId, in: query, description: 仓库 id, schema: {type: integer, format: int64, example: 1}}
        - {name: productId, in: query, description: 商品 id, schema: {type: integer, format: int64, example: 1}}
        - {name: flowType, in: query, description: 流水类型（入库/出库/调拨入/调拨出/盘盈/盘亏/调整）, schema: {type: string, example: 入库}}
        - {name: refNo, in: query, description: 关联单号精确查询, schema: {type: string, example: RK20261106001}}
        - {name: startDate, in: query, description: 变动开始日期（yyyy-MM-dd，含两端）, schema: {type: string, format: date, example: '2026-11-01'}}
        - {name: endDate, in: query, description: 变动结束日期（yyyy-MM-dd，含两端）, schema: {type: string, format: date, example: '2026-11-06'}}
      responses:
        '200': {$ref: '#/components/responses/Ok_FlowPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/inventory/summary:
    get:
