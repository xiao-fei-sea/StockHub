  # ===== 操作日志（API-OPL-001~002）=====
  /api/logs:
    get:
      operationId: listLogs
      summary: 操作日志分页查询
      description: "操作日志分页查询，权限标识 perms：sys:log:list。支持 module/status/keyword/startDate/endDate 过滤；请求参数已脱敏存储。"
      tags:
        - 操作日志
      parameters:
        - $ref: '#/components/parameters/pageNum'
        - $ref: '#/components/parameters/pageSize'
        - {name: module, in: query, description: 模块名精确过滤, schema: {type: string, example: 入库管理}}
        - {name: status, in: query, description: 操作状态（0 失败 1 成功）, schema: {type: integer, format: int32, example: 1}}
        - {name: keyword, in: query, description: 模糊关键字（操作人/标题）, schema: {type: string, example: 张}}
        - {name: startDate, in: query, description: 操作开始日期（yyyy-MM-dd）, schema: {type: string, format: date, example: '2026-11-01'}}
        - {name: endDate, in: query, description: 操作结束日期（yyyy-MM-dd）, schema: {type: string, format: date, example: '2026-11-06'}}
      responses:
        '200': {$ref: '#/components/responses/Ok_LogPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/logs/{id}:
    get:
      operationId: getLogById
      summary: 操作日志详情
      description: "按 id 查询操作日志详情（含请求参数与响应结果），权限标识 perms：sys:log:list。"
      tags:
        - 操作日志
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_OperLog'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT 访问令牌。Header 格式：Authorization: Bearer <accessToken>；access token 有效期 2 小时，refresh token 7 天；仅 /api/auth/login 与 /api/auth/refresh 免认证（security: []）。"
  parameters:
    pageNum:
      name: pageNum
      in: query
      description: 页码，从 1 开始，小于 1 时按 1 处理，默认 1
      schema: {type: integer, format: int32, default: 1, example: 1}
    pageSize:
      name: pageSize
      in: query
      description: 每页条数，默认 20，最大 100，超过 100 时按 100 处理
      schema: {type: integer, format: int32, default: 20, maximum: 100, example: 20}
    IdPath:
      name: id
      in: path
      required: true
      description: 资源主键 id
      schema: {type: integer, format: int64, example: 1}
  responses:
    # ---- 通用错误响应 ----
    Unauthorized:
      description: 401 未认证或 Token 过期（code=401，业务码如 40101/40102/40103）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {code: 401, message: 认证失败，Token 已过期，请重新登录, data: null, timestamp: '2026-11-06 16:00:00'}
    Forbidden:
      description: 403 无权限（code=403，业务码如 40301 功能权限不足、40302 数据仓库权限越权）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {code: 403, message: 无权限访问该资源或数据仓库越权, data: null, timestamp: '2026-11-06 16:00:00'}
    BadRequest:
      description: 400 参数校验失败（body.code=40001，返回首个字段的中文错误提示）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {code: 40001, message: password 至少 8 位且需包含字母与数字, data: null, timestamp: '2026-11-09 16:30:00'}
    Conflict:
      description: 409 业务冲突（单据状态/唯一性/并发等 5 位业务错误码 40001~50001；待确认：实现时业务错误 HTTP 状态码统一口径）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {code: 40901, message: 当前单据状态不允许该操作, data: null, timestamp: '2026-11-06 16:00:00'}
    ServerError:
      description: 500 系统异常（code=500，50001 执行失败 50002 资源不存在）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {code: 500, message: 系统繁忙，请稍后重试, data: null, timestamp: '2026-11-06 16:00:00'}
    # ---- 通用成功响应 ----
    Ok_Null:
      description: 操作成功（data 为 null；待确认：创建类接口是否返回新建资源 id）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
          example: {code: 200, message: 操作成功, data: null, timestamp: '2026-11-06 16:00:00'}
    # ---- 认证/用户 ----
    Ok_Login:
      description: 登录/刷新令牌成功（data 为 LoginResponse）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/LoginResponse'}}}
          example: {code: 200, message: 登录成功, data: {accessToken: eyJhbGciOiJIUzI1NiJ9.xxx, refreshToken: eyJhbGciOiJIUzI1NiJ9.yyy, expiresIn: 7200, tokenType: Bearer}, timestamp: '2026-11-06 16:00:00'}
    Ok_AuthInfo:
      description: 当前用户信息、菜单与按钮权限（data 为 AuthInfo）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/AuthInfo'}}}
          example: {code: 200, message: 操作成功, data: {user: {id: 1, username: admin, realName: 超级管理员}, menus: [], perms: [sys:user:list, sys:user:add], roles: [ROLE_ADMIN]}, timestamp: '2026-11-06 16:00:00'}
    Ok_UserWarehouses:
      description: 用户已授权仓库列表（data 为 Option 数组，id 为仓库 id）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Option'}}}}
          example: {code: 200, message: 操作成功, data: [{id: 1, name: 华东一仓}, {id: 2, name: 华南一仓}], timestamp: '2026-11-06 16:00:00'}
    Ok_Options:
      description: 下拉选项列表（data 为 Option 数组，name 为对应显示名）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Option'}}}}
          example: {code: 200, message: 操作成功, data: [{id: 1, name: 华东一仓}, {id: 2, name: 华南一仓}], timestamp: '2026-11-06 16:00:00'}
    # ---- 树结构 ----
    Ok_MenuTree:
      description: 菜单树（data 为菜单根节点数组，children 递归）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/MenuTree'}}}
          example: {code: 200, message: 操作成功, data: [{id: 1, menuName: 系统管理, menuType: C, sort: 1}], timestamp: '2026-11-06 16:00:00'}
    Ok_DeptTree:
      description: 部门树（data 为部门根节点数组，children 递归）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - {type: object, properties: {data: {$ref: '#/components/schemas/DeptTree'}}}
          example: {code: 200, message: 操作成功, data: [{id: 1, deptName: 总公司, parentId: 0}], timestamp: '2026-11-06 16:00:00'}
    Ok_CategoryTree:
      description: 商品分类树（data 为分类根节点数组，children 递归）
      content:
        application/json:
          schema:
            allOf:
