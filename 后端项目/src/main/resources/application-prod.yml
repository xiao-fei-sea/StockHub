# 生产环境配置（全部敏感项由环境变量注入）
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    default-property-inclusion: non_null

smartwms:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expire-seconds: 7200
    refresh-token-expire-seconds: 604800

logging:
  level:
    root: INFO
    com.smartwms: INFO
