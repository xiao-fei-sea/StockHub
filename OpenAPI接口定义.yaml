  # ===== 库存盘点（API-STK-001~011）=====
  /api/stocktakes:
    get:
      operationId: listStocktakes
      summary: 盘点单分页查询
      description: "盘点单分页查询，权限标识 perms：sys:stocktake:list。支持 status/warehouseId/stocktakeNo/keyword/startDate/endDate 过滤。"
      tags:
        - 库存盘点
      parameters:
        - $ref: '#/components/parameters/pageNum'
        - $ref: '#/components/parameters/pageSize'
        - {name: status, in: query, description: 单据状态（0 草稿 1 待审核 2 已审核 3 已完成（已过账，POSTED）4 已驳回 5 已取消）, schema: {type: integer, format: int32, example: 1}}
        - {name: warehouseId, in: query, description: 仓库 id, schema: {type: integer, format: int64, example: 1}}
        - {name: stocktakeNo, in: query, description: 盘点单号精确查询, schema: {type: string, example: PD20261106001}}
        - {name: keyword, in: query, description: 模糊关键字, schema: {type: string, example: PD2026}}
        - {name: startDate, in: query, description: 创建开始日期（yyyy-MM-dd）, schema: {type: string, format: date, example: '2026-11-01'}}
        - {name: endDate, in: query, description: 创建结束日期（yyyy-MM-dd）, schema: {type: string, format: date, example: '2026-11-06'}}
      responses:
        '200': {$ref: '#/components/responses/Ok_StocktakePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      operationId: createStocktake
      summary: 创建盘点单
      description: "创建盘点单并自动生成盘点明细（账面数 book_qty 取创建时点库存），权限标识 perms：sys:stocktake:add。单号按 PD+yyyyMMdd+3 位序号自动生成；业务错误：40904 单号重复、40905 重复提交。"
      tags:
        - 库存盘点
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeOrderCreateRequest'
            example: {warehouseId: 1, areaId: 1, scope: 按库区, planDate: '2026-11-10', remark: A 区月度盘点}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/stocktakes/{id}:
    get:
      operationId: getStocktakeById
      summary: 盘点单详情
      description: "查询盘点单详情（含明细 items 与差异数），权限标识 perms：sys:stocktake:list。"
      tags:
        - 库存盘点
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_Stocktake'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      operationId: updateStocktake
      summary: 录入/更新实盘数
      description: "录入或更新盘点明细实盘数（仅草稿 0），权限标识 perms：sys:stocktake:edit。按明细差异 differ_qty=actual_qty-book_qty 计算；业务错误：40901 状态不允许。"
      tags:
        - 库存盘点
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeOrderUpdateRequest'
            example: {items: [{id: 1001, actualQty: 98.000, diffReason: 破损}, {id: 1002, actualQty: 50.000}]}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      operationId: deleteStocktake
      summary: 删除盘点单
      description: "删除盘点单（仅草稿 0），权限标识 perms：sys:stocktake:delete。业务错误：40901 状态不允许。"
      tags:
        - 库存盘点
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/stocktakes/{id}/submit:
    put:
      operationId: submitStocktake
      summary: 盘点单提交
      description: "提交盘点单至待审核（0→1），权限标识 perms：sys:stocktake:submit。业务错误：40901 状态不允许、40905 重复提交。"
      tags:
        - 库存盘点
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/stocktakes/{id}/audit:
    put:
      operationId: auditStocktake
      summary: 盘点单审核
      description: "审核盘点差异（1→2，由主管授权差异），权限标识 perms：sys:stocktake:audit。body 可含 remark。业务错误：40901 状态不允许。"
      tags:
        - 库存盘点
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRequest'
            example: {remark: 差异合理，同意过账}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/stocktakes/{id}/reject:
    put:
      operationId: rejectStocktake
      summary: 盘点单驳回
      description: "驳回盘点单（1→4），权限标识 perms：sys:stocktake:reject。reason 必填。业务错误：40901 状态不允许。"
      tags:
        - 库存盘点
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
            example: {reason: 差异过大，请复盘}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/stocktakes/{id}/post:
    put:
      operationId: postStocktake
      summary: 盘点单过账
      description: "过账盘点单（2→3），按差异调整库存（盘盈增、盘亏减）并写对应流水，权限标识 perms：sys:stocktake:post。业务错误：40901 状态不允许、40902 库存不足（盘亏超库存）、40907 盘点期间并发过账冲突。"
      tags:
        - 库存盘点
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/stocktakes/{id}/cancel:
    put:
      operationId: cancelStocktake
      summary: 盘点单取消
      description: "取消盘点单（0/1/4→5，终态），权限标识 perms：sys:stocktake:cancel。业务错误：40901 状态不允许。"
      tags:
        - 库存盘点
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/stocktakes/{id}/withdraw:
    put:
      operationId: withdrawStocktake
      summary: 盘点单撤回
      description: "撤回盘点单至草稿（1/4→0），权限标识 perms：sys:stocktake:withdraw。业务错误：40901 状态不允许。"
      tags:
        - 库存盘点
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}

  # ===== 库存预警（API-ALR-001~008）=====
  /api/alert-rules:
    get:
      operationId: listAlertRules
      summary: 预警规则分页查询
      description: "预警规则分页查询，权限标识 perms：sys:alert:rule:list。支持 alertType/status/warehouseId 过滤。"
      tags:
        - 库存预警
      parameters:
        - $ref: '#/components/parameters/pageNum'
        - $ref: '#/components/parameters/pageSize'
        - {name: alertType, in: query, description: 预警类型（LOW_STOCK/HIGH_STOCK/NEAR_EXPIRY/EXPIRED）, schema: {type: string, example: LOW_STOCK}}
        - {name: status, in: query, description: 状态（0 停用 1 启用）, schema: {type: integer, format: int32, example: 1}}
        - {name: warehouseId, in: query, description: 仓库 id（空表示全部仓库）, schema: {type: integer, format: int64, example: 1}}
      responses:
        '200': {$ref: '#/components/responses/Ok_AlertRulePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      operationId: createAlertRule
      summary: 创建预警规则
      description: "创建库存预警规则，权限标识 perms：sys:alert:rule:add。业务错误：40904 编码已存在。"
      tags:
        - 库存预警
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRule'
            example: {ruleName: 纸巾类低于下限预警, warehouseId: 1, categoryId: 1, alertType: LOW_STOCK, minQty: 100.000, status: 1, remark: 每日扫描}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/alert-rules/{id}:
    get:
      operationId: getAlertRuleById
      summary: 预警规则详情
      description: "按 id 查询预警规则详情，权限标识 perms：sys:alert:rule:list。"
      tags:
        - 库存预警
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_AlertRule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      operationId: updateAlertRule
      summary: 编辑预警规则
      description: "编辑预警规则，权限标识 perms：sys:alert:rule:edit。"
      tags:
        - 库存预警
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRule'
            example: {ruleName: 纸巾类低于下限预警, warehouseId: 1, categoryId: 1, alertType: LOW_STOCK, minQty: 150.000, status: 1, remark: 每日扫描}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      operationId: deleteAlertRule
      summary: 删除预警规则
      description: "删除预警规则（逻辑删除），权限标识 perms：sys:alert:rule:delete。业务错误：40901 存在未处理预警记录时不可删除。"
      tags:
        - 库存预警
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/alerts:
    get:
      operationId: listAlerts
      summary: 预警记录分页查询
      description: "库存预警记录分页查询，权限标识 perms：sys:alert:list。支持 alertType/status/warehouseId/level 过滤。"
      tags:
        - 库存预警
      parameters:
        - $ref: '#/components/parameters/pageNum'
        - $ref: '#/components/parameters/pageSize'
        - {name: alertType, in: query, description: 预警类型（LOW_STOCK/HIGH_STOCK/NEAR_EXPIRY/EXPIRED）, schema: {type: string, example: NEAR_EXPIRY}}
        - {name: status, in: query, description: 处理状态（0 未处理 1 已处理）, schema: {type: integer, format: int32, example: 0}}
        - {name: warehouseId, in: query, description: 仓库 id, schema: {type: integer, format: int64, example: 1}}
        - {name: level, in: query, description: 预警级别（提示/警告/严重）, schema: {type: string, example: 警告}}
      responses:
        '200': {$ref: '#/components/responses/Ok_AlertRecordPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/alerts/{id}/handle:
    put:
      operationId: handleAlert
      summary: 处理预警
      description: "处理预警记录（未处理→已处理），权限标识 perms：sys:alert:handle。业务错误：40901 状态不允许（已处理不可重复处理）。"
      tags:
        - 库存预警
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertHandleRequest'
            example: {handleRemark: 已补货，库存恢复至安全线}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/alerts/scan:
    post:
      operationId: scanAlerts
      summary: 手动触发预警扫描
      description: "手动触发预警规则扫描并生成预警记录（可选接口，正常由每日定时任务执行），权限标识 perms：sys:alert:scan。"
      tags:
        - 库存预警
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertScanRequest'
            example: {warehouseId: 1}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}

