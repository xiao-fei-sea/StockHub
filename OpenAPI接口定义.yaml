  # ===== 入库管理（API-INB-001~011）=====
  /api/inbounds:
    get:
      operationId: listInbounds
      summary: 入库单分页查询
      description: "入库单分页查询，权限标识 perms：sys:inbound:list。支持 status/warehouseId/inboundNo/keyword/startDate/endDate 过滤，服务端叠加数据仓库权限。"
      tags:
        - 入库管理
      parameters:
        - $ref: '#/components/parameters/pageNum'
        - $ref: '#/components/parameters/pageSize'
        - {name: status, in: query, description: 单据状态（0 草稿 1 待审核 2 已审核 3 已完成（已过账，POSTED）4 已驳回 5 已取消）, schema: {type: integer, format: int32, example: 1}}
        - {name: warehouseId, in: query, description: 仓库 id, schema: {type: integer, format: int64, example: 1}}
        - {name: inboundNo, in: query, description: 入库单号精确查询, schema: {type: string, example: RK20261106001}}
        - {name: keyword, in: query, description: 模糊关键字, schema: {type: string, example: RK2026}}
        - {name: startDate, in: query, description: 创建开始日期（yyyy-MM-dd，含两端）, schema: {type: string, format: date, example: '2026-11-01'}}
        - {name: endDate, in: query, description: 创建结束日期（yyyy-MM-dd，含两端）, schema: {type: string, format: date, example: '2026-11-06'}}
      responses:
        '200': {$ref: '#/components/responses/Ok_InboundPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      operationId: createInbound
      summary: 创建入库单
      description: "创建入库单草稿（含明细 items[]），权限标识 perms：sys:inbound:add。单号按 RK+yyyyMMdd+3 位序号自动生成；业务错误：40904 单号重复、40905 重复提交、40906 货位状态不可用。"
      tags:
        - 入库管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundOrderCreateRequest'
            example: {orderType: 采购入库, supplierId: 1, sourceOrderNo: PO20261106001, expectDate: '2026-11-08', warehouseId: 1, remark: 例行采购, items: [{lineNo: 1, productId: 1, locationId: 1, batchNo: B2026110601, productionDate: '2026-11-01', expiryDate: '2027-11-01', planQty: 100.000, unit: 包, remark: 首批}]}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/inbounds/{id}:
    get:
      operationId: getInboundById
      summary: 入库单详情
      description: "查询入库单详情（含明细 items），权限标识 perms：sys:inbound:list。"
      tags:
        - 入库管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': {$ref: '#/components/responses/Ok_Inbound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      operationId: updateInbound
      summary: 编辑入库单
      description: "编辑入库单（仅草稿 0/已驳回 4 可编辑），权限标识 perms：sys:inbound:edit。业务错误：40901 状态不允许。"
      tags:
        - 入库管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundOrderCreateRequest'
            example: {orderType: 采购入库, supplierId: 1, sourceOrderNo: PO20261106001, expectDate: '2026-11-08', warehouseId: 1, remark: 例行采购, items: [{lineNo: 1, productId: 1, locationId: 1, batchNo: B2026110601, planQty: 120.000, unit: 包}]}
      responses:
        '200': {$ref: '#/components/responses/Ok_Null'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      operationId: deleteInbound
      summary: 删除入库单
      description: "删除入库单（仅草稿 0 可删除），权限标识 perms：sys:inbound:delete。业务错误：40901 状态不允许。"
      tags:
        - 入库管理
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
