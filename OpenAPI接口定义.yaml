      properties:
        orderType: {type: string, description: 单据类型（销售出库/调拨出库/退货出库/报损出库，对应库表 order_type 枚举 1/2/3/4；传参与返回均为中文枚举名，待确认：是否改为数字编码传递）, example: 销售出库}
        customerId: {type: integer, format: int64, description: 客户 id（销售出库必填）, example: 1}
